---
layout: page
---

{% if site.feed_show_tags != false and page.tags.size > 0 %}
<div class="blog-tags">
  <span>Tags:</span>
  {% for tag in page.tags %}
  <a href="{{ '/archives' | absolute_url }}#{{- tag -}}">{{- tag -}}</a>
  {% endfor %}
</div>
{% endif %}

<div id="recipe-body">
  {{ content }}
</div>

<script src="{{ '/assets/recipe.js' | relative_url }}"></script>
